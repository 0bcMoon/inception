user  nginx;

worker_processes  auto;

error_log  /var/log/nginx/error.log;

daemon off;

events {
    worker_connections  1024;
}

http {

	include mime.types;
	ssl_protocols TLSv1.2;

    server {

        listen 443 ssl;
        server_name hibenouk.42.fr www.hibenouk.42.fr;

        ssl_certificate     /etc/ssl/certs/hibenouk-nginx-selfsigned.crt;
        ssl_certificate_key /etc/ssl/private/hibenouk-nginx-selfsigned.key;

        index index.php;
        root /var/www/html/wordpress;
        location ~ \.php$ {
            try_files $uri $uri/ =404;
            fastcgi_pass wordpress:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    server {
        listen 443 ssl;
        server_name adminer.me www.adminer.me;
        ssl_certificate     /etc/ssl/certs/adminer-nginx-selfsigned.crt;
        ssl_certificate_key /etc/ssl/private/adminer-nginx-selfsigned.key;

        index index.php;
        root /var/www/html/adminer;

        location ~ \.php$ {
            try_files $uri $uri/ =404;
            fastcgi_pass adminer:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    server {
        listen 443 ssl;
        server_name cadvisor.me www.cadvisor.me;

        ssl_certificate     /etc/ssl/certs/cadvisor-nginx-selfsigned.crt;
        ssl_certificate_key /etc/ssl/private/cadvisor-nginx-selfsigned.key;
        location / { 
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_pass http://cadvisor:8000/;
        }
    }

    server {
        listen 443 ssl;
        server_name hibenouk.1337.me www.hibenouk.1337.me;

        ssl_certificate     /etc/ssl/certs/port-nginx-selfsigned.crt;
        ssl_certificate_key /etc/ssl/private/port-nginx-selfsigned.key;

        location / { 
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_pass http://website:4000/;
        }
    }
}
