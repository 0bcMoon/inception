services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx/
    env_file: 
      - .env
    networks:
      - inception
    ports:
      - "443:443"
    restart: always
    volumes:
      - wordpress:/var/www/html/wordpress
      - adminer:/var/www/html/adminer

  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb/
    env_file:
      - .env
    networks:
      - inception
    restart: always
    volumes:
      - mariadb:/var/lib/mysql

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress/
    env_file:
      - .env
    networks:
      - inception
    restart: always
    volumes:
      - wordpress:/var/www/html/wordpress

  redis:
    container_name: redis
    build: ./requirements/bonus/redis/
    env_file:
      - .env
    networks:
      - inception
    restart: always

  adminer:
    container_name: adminer
    build: ./requirements/bonus/adminer
    networks:
      - inception
    restart: always
    volumes:
      - adminer:/var/www/html/adminer

  cadvisor:
    container_name: cadvisor 
    build: ./requirements/bonus/cadvisor
    networks:
      - inception
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
  ftp:
    container_name: ftp 
    build: ./requirements/bonus/ftp
    networks:
      - inception
    restart: always
    env_file:
      - .env
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    volumes:
      - wordpress:/srv/ftp/wordpress

  website:
    container_name: website 
    build: ./requirements/bonus/website/
    networks:
      - inception
    restart: always

networks:
  inception:
    name: inception

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/mariadb 

  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/wordpress  

  adminer:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/adminer
